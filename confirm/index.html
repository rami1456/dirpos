<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c0b">
<title>DIR POS — التأكيد</title>
<link rel="icon" href="../img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* DIR POS confirmation desk — like a pro call-centre app: black glass, DIR orange glow,
   one coloured lane per status, call + WhatsApp right on each card. */
:root{--bg:#0a0908;--panel:#141210;--panel2:#1c1916;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#f6f1ea;--muted:#9b9086;--orange:#f25c0a;--orange2:#ff8a2a;--green:#1fc283;--red:#ff5f57;--blue:#4fa3ff;--yellow:#f5c044;--violet:#a78bfa;--f:'El Messiri',system-ui,sans-serif;--n:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--text);font:600 16px/1.5 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(700px 380px at 85% -120px,rgba(242,92,10,.22),transparent 70%),radial-gradient(500px 300px at 0 110%,rgba(242,92,10,.08),transparent 70%),var(--bg);background-attachment:fixed;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--n);direction:ltr;unicode-bidi:isolate;font-weight:700;letter-spacing:.2px}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;cursor:pointer;text-decoration:none;color:var(--text);transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(180deg,var(--orange2),var(--orange));border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(242,92,10,.7)}
.btn.green{background:linear-gradient(180deg,#2bd896,var(--green));border-color:transparent;color:#032a1b;box-shadow:0 8px 22px -10px rgba(31,194,131,.8)}
.btn.wa{background:#1fa855;border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
input,select,textarea{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line2);background:#0f0e0c;padding:10px 14px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(242,92,10,.18)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login form{width:min(400px,100%);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line2);border-radius:26px;padding:30px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.login img{height:52px;display:block;margin:0 auto 10px}
.login h1{font-size:24px;text-align:center;margin:0}
.login p{text-align:center;color:var(--muted);margin:2px 0 14px;font-size:15px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
/* header */
header{position:sticky;top:0;z-index:5;background:rgba(10,9,8,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:1000px;margin:auto}
.top img{height:30px}
.me{margin-inline-start:auto;text-align:end;line-height:1.25}
.me b{display:block;font-size:15px}.me span{color:var(--muted);font-size:12px}
.icon{width:44px;height:44px;min-height:44px;padding:0;border-radius:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;max-width:1000px;margin:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.03);cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap;color:var(--muted)}
.tab b{font-family:var(--n);font-size:13px;min-width:24px;height:22px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--text)}
.tab.on{background:var(--text);border-color:var(--text);color:#111}.tab.on b{background:var(--orange);color:#fff}
main{max-width:1000px;margin:auto;padding:14px 16px 100px}
.searchw{position:relative;margin-bottom:14px}
.searchw svg{position:absolute;inset-inline-start:14px;top:15px;color:var(--muted)}
.searchw input{padding-inline-start:44px}
/* cards */
.list{display:grid;gap:10px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--muted))}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:var(--c,#444);box-shadow:inset 0 -10px 20px rgba(0,0,0,.25)}
.who .n{font-size:17px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{color:var(--muted);font-size:13.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.quick{display:flex;gap:6px}
.qb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text)}
.qb.call{background:rgba(242,92,10,.15);border-color:rgba(242,92,10,.35);color:var(--orange2)}
.qb.wa{background:rgba(31,168,85,.15);border-color:rgba(31,168,85,.35);color:#3fd27b}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.06);white-space:nowrap}
.chip.st{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.chip.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.late{color:var(--red)!important}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.empty svg{width:46px;height:46px;color:var(--orange2);margin-bottom:8px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:min(640px,100%);max-height:94dvh;overflow:auto;background:#12100e;border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 18px 28px;animation:up .22s ease-out}
.sheet>div::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:28px}}
@media(prefers-reduced-motion:reduce){.sheet>div{animation:none}}
.hd{display:flex;gap:14px;align-items:center}
.hd .av{width:58px;height:58px;font-size:22px;border-radius:18px}
.hd h2{margin:0;font-size:22px;line-height:1.2}
.hd .x{margin-inline-start:auto}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.fact span{display:block;color:var(--muted);font-size:12.5px}.fact b{font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>.btn{flex:1 1 130px}
.big{min-height:56px;font-size:17px;border-radius:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;background:rgba(255,255,255,.025)}
.box h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.box h3 svg{color:var(--orange2)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.act{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;font-weight:700;font-size:14px;color:var(--text)}
.act svg{width:24px;height:24px;color:var(--c)}
.act:active{transform:scale(.97)}
.cbw{margin-top:10px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reason{border:1px solid rgba(255,95,87,.35);color:#ff8c85;background:rgba(255,95,87,.08);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0;border:1px solid var(--line2);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer;color:var(--text);background:#0f0e0c}
.seg label b{display:block;color:var(--orange2)}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--orange);background:rgba(242,92,10,.12)}
.seg label:has(input:disabled){opacity:.35;cursor:not-allowed}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(242,92,10,.22),rgba(242,92,10,.06));border:1px solid rgba(242,92,10,.35)}
.total span{color:#f3d2bd;font-size:14px}
.total b{font-family:var(--n);font-size:28px;color:#fff}
.log{white-space:pre-line;color:var(--muted);font-size:13px;margin-top:6px;line-height:1.7}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.kpi b{display:block;font-family:var(--n);font-size:30px;font-weight:800;line-height:1.2}
.kpi span{color:var(--muted);font-size:14px}
.kpi.hot{background:linear-gradient(135deg,var(--orange2),var(--orange));border:0}.kpi.hot span{color:#ffe3d0}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.agents{display:grid;gap:10px}
.agent{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.agent .stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.agent .stats b{color:var(--text);font-family:var(--n)}
.user{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:14px;padding:12px 18px;font-weight:700;z-index:30;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.bad{background:var(--red);color:#fff}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<section class="login" id="loginView">
  <form id="loginForm" novalidate>
    <img src="../img/logo-wide.webp" alt="DIR POS">
    <h1>تأكيد الطلبيات</h1>
    <p>ادخل بالاسم والـ PIN تاعك</p>
    <label for="lu">الاسم</label>
    <input id="lu" autocomplete="username" required>
    <label for="lp">الـ PIN</label>
    <input id="lp" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn main" style="width:100%;margin-top:16px" type="submit">دخول</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<div id="appView" class="hide">
  <header>
    <div class="top">
      <img src="../img/logo-wide.webp" alt="DIR POS">
      <div class="me"><b id="meName"></b><span id="sync" class="num"></span></div>
      <button class="btn icon" id="refresh" title="تحديث" aria-label="تحديث"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="btn icon" id="logout" title="خروج" aria-label="خروج"><svg class="i"><use href="#i-out"/></svg></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main>
    <div id="listView">
      <div class="searchw"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="بحث بالاسم ولا الرقم"></div>
      <div class="list" id="list"></div>
    </div>
    <div id="adminView" class="hide"></div>
  </main>
</div>

<div class="sheet hide" id="sheet" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>

<script>
{
const API = "https://script.google.com/macros/s/AKfycbzGfeBLcHIxixqZXsXXdLj0kuPpZv0_rE973_7g5BPMaJ2SJdGYgVq8J6_bBrjuaovDNw/exec";
const WILAYAS = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام","تقرت","جانت","المغير","المنيعة"];
const WA_TEXT = n => `السلام عليكم ${n || ''} 👋 معاك فريق DIR POS. شفنا بلي حمّلت التطبيق، كيفاش لقيتو؟ إذا عجبك، نفعّلولك الرخصة مدى الحياة بـ 7900 دج والخلاص عند الاستلام 🙏`;
const REASONS = ['ما حبش', 'غالي عليه', 'ما عندوش أندرويد', 'رقم غالط', 'جرّب وما عجبوش', 'آخر'];
const TABS = [
  {k:'due', t:'لازم نعيطو'}, {k:'all', t:'الكل'}, {k:'مهتم', t:'مهتمين'},
  {k:'مؤكد', t:'مؤكدة'}, {k:'مبعوث', t:'مبعوثة'}, {k:'ملغي', t:'ملغية'}
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, cred = null, leads = [], fees = {}, price = 7900, tab = 'due', open = null;

const store = {get(){try{return JSON.parse(localStorage.getItem('dirpos_confirm')||'null')}catch(e){return null}},
  set(v){try{v?localStorage.setItem('dirpos_confirm',JSON.stringify(v)):localStorage.removeItem('dirpos_confirm')}catch(e){}}};

async function api(action, extra) {
  const res = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({action, user:cred?.user, pin:cred?.pin}, extra || {}))});
  const r = await res.json();
  if (!r.ok) throw new Error(r.error || 'خطأ');
  return r;
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const fmtD = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('fr-DZ',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-DZ',{hour:'2-digit',minute:'2-digit'}); };
const day = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('fr-DZ',{day:'2-digit',month:'2-digit',year:'2-digit'}); };
const whenDue = l => l.callback || l.due || l.at;
const isOpen = l => ['جديد','ما ردّش','عاود عيطلو','مهتم'].includes(l.status);
const isDue = l => isOpen(l) && new Date(whenDue(l)) <= new Date();
const SC = {'جديد':'var(--blue)','ما ردّش':'var(--yellow)','عاود عيطلو':'var(--violet)','مهتم':'var(--orange2)','مؤكد':'var(--green)','مبعوث':'var(--green)','ملغي':'var(--red)'};
const AC = s => s === 'مواد غذائية' ? '#e8590c' : s === 'محل ملابس' ? '#7c5cff' : s === 'محل جملة' ? '#2f7de1' : '#5b544d';
const ini = n => (String(n || '؟').trim()[0] || '؟');
const ic = (n, cls) => `<svg class="i ${cls||''}"><use href="#i-${n}"/></svg>`;
const chip = s => `<span class="chip st" style="--c:${SC[s]||'var(--muted)'}">${esc(s)}</span>`;
const intl = p => '213' + String(p).replace(/\D/g,'').replace(/^0/,'');

/* ---------- login ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  cred = {user: $('lu').value.trim(), pin: $('lp').value.trim()};
  $('lerr').textContent = '';
  try { await start(); store.set(cred); }
  catch (err) { $('lerr').textContent = err.message === 'Failed to fetch' ? 'ما كانش أنترنت.' : err.message; cred = null; }
});
$('logout').onclick = () => { store.set(null); location.reload(); };
$('refresh').onclick = () => load(true);

async function start() {
  const r = await api('login');
  me = r.me; fees = r.fees; price = r.price;
  $('meName').textContent = me.name + (me.role === 'admin' ? ' · مدير' : '');
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  await load();
}

async function load(manual) {
  $('sync').textContent = 'تحديث...';
  try {
    leads = (await api('list')).leads;
    $('sync').textContent = new Date().toLocaleTimeString('fr-DZ',{hour:'2-digit',minute:'2-digit'});
    render();
  } catch (err) { $('sync').textContent = ''; toast(err.message, true); }
}
setInterval(() => { if (me && !open) load(); }, 60000);

/* ---------- list ---------- */
function inTab(l) {
  if (tab === 'due') return isDue(l);
  if (tab === 'all') return true;
  return l.status === tab;
}
function render() {
  const tabs = me.role === 'admin' ? TABS.concat([{k:'admin', t:'الإحصائيات'}]) : TABS;
  $('tabs').innerHTML = tabs.map(x => {
    const n = x.k === 'admin' ? '' : `<b>${leads.filter(l => (x.k==='due'?isDue(l):x.k==='all'?true:l.status===x.k)).length}</b>`;
    return `<button class="tab${tab===x.k?' on':''}" data-k="${x.k}">${x.t}${n}</button>`;
  }).join('');
  $('listView').classList.toggle('hide', tab === 'admin');
  $('adminView').classList.toggle('hide', tab !== 'admin');
  if (tab === 'admin') return renderAdmin();
  const q = $('q').value.trim();
  const rows = leads.filter(inTab).filter(l => !q || l.name.includes(q) || l.phone.includes(q.replace(/\s/g,'')))
    .sort((a, b) => new Date(whenDue(a)) - new Date(whenDue(b)));
  $('list').innerHTML = rows.length ? rows.map(l => {
    const late = isDue(l) && (Date.now() - new Date(whenDue(l))) > 864e5;
    const sub = l.tracking ? ic('truck') + ' ' + esc(l.shipStatus || '') : (isOpen(l) ? ic('clock') + ' <span class="num">' + esc(fmtD(whenDue(l))) + '</span>' : '');
    return `<div class="card" role="button" tabindex="0" data-id="${esc(l.id)}" style="--c:${SC[l.status]||'var(--muted)'}">
      <div class="av" style="--c:${AC(l.shop)}">${esc(ini(l.name))}</div>
      <div class="who">
        <div class="n">${esc(l.name || 'بلا اسم')}</div>
        <div class="s">${chip(l.status)}<span>${esc(l.shop || '—')}</span>${l.attempts?'<span class="num">'+l.attempts+'×</span>':''}${l.agent && me.role==='admin'?'<span>· '+esc(l.agent)+'</span>':''}</div>
        <div class="s ${late?'late':''}" style="margin-top:4px">${sub}</div>
      </div>
      <div class="quick">
        <a class="qb call" href="tel:${esc(l.phone)}" aria-label="اتصل">${ic('phone')}</a>
        <a class="qb wa" href="https://wa.me/${intl(l.phone)}?text=${encodeURIComponent(WA_TEXT(l.name))}" target="_blank" rel="noopener" aria-label="واتساب">${ic('wa')}</a>
      </div>
    </div>`;
  }).join('') : `<div class="empty">${ic(tab==='due'?'party':'search')}<div>${tab==='due'?'ما كان حتى زبون لازم تعيطلو دروك 👌':'والو هنا.'}</div></div>`;
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { tab = b.dataset.k; render(); } });
$('q').addEventListener('input', render);
$('list').addEventListener('click', e => { if (e.target.closest('a')) return; const c = e.target.closest('.card'); if (c) openLead(c.dataset.id); });
$('list').addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLead(c.dataset.id); } });

/* ---------- one customer ---------- */
function feeOf(w, home) { const f = fees[w]; return f ? f[home ? 1 : 0] : null; }
function openLead(id) {
  const l = leads.find(x => x.id === id); if (!l) return;
  open = l;
  const w = Number(String(l.wilaya).split(' ')[0]) || '';
  const home = l.delivery === 'المنزل';
  const locked = ['مؤكد','مبعوث'].includes(l.status);
  $('sheetBody').innerHTML = `
    <div class="hd">
      <div class="av" style="--c:${AC(l.shop)}">${esc(ini(l.name))}</div>
      <div><h2>${esc(l.name || 'بلا اسم')}</h2><div style="margin-top:4px">${chip(l.status)}</div></div>
      <button class="btn icon x" data-act="close" aria-label="سكّر">${ic('x')}</button>
    </div>
    <div class="facts">
      <div class="fact"><span>الهاتف</span><b class="num">${esc(l.phone)}</b></div>
      <div class="fact"><span>النشاط</span><b>${esc(l.shop || '—')}</b></div>
      <div class="fact"><span>حمّل التطبيق</span><b class="num">${esc(fmtD(l.at))}</b></div>
      <div class="fact"><span>المحاولات</span><b><span class="num">${l.attempts}</span>${l.agent?' · '+esc(l.agent):''}</b></div>
      ${l.tracking?`<div class="fact"><span>التتبع</span><b class="num">${esc(l.tracking)}</b></div><div class="fact"><span>التوصيل</span><b>${esc(l.shipStatus)}</b></div>`:''}
    </div>
    <div class="row">
      <a class="btn main big" href="tel:${esc(l.phone)}" data-act="dial">${ic('phone')} اتصل</a>
      <a class="btn wa big" href="https://wa.me/${intl(l.phone)}?text=${encodeURIComponent(WA_TEXT(l.name))}" target="_blank" rel="noopener">${ic('wa')} واتساب</a>
    </div>
    ${locked ? '' : `
    <div class="box"><h3>${ic('phone')} النتيجة تاع الاتصال</h3>
      <div class="acts">
        <button class="act" data-act="noanswer" style="--c:var(--yellow)">${ic('miss')}ما ردّش</button>
        <button class="act" data-act="showcb" style="--c:var(--violet)">${ic('clock')}عاود عيطلو</button>
        <button class="act" data-act="interested" style="--c:var(--orange2)">${ic('star')}مهتم</button>
      </div>
      <div class="cbw hide" id="cbw"><label for="cb">النهار والساعة</label>
        <div class="row" style="margin-top:0"><input id="cb" type="datetime-local" style="flex:2 1 180px"><button class="btn" data-act="callback" style="flex:1 1 100px">سجّل</button></div></div>
      <label>${ic('ban')} ملغي، علاش؟</label>
      <div class="reasons">${REASONS.map(r => `<button class="reason" data-act="cancel" data-r="${r}">${r}</button>`).join('')}</div>
    </div>`}
    <div class="box"><h3>${ic('check')} ${locked ? 'الطلبية' : 'أكّد الطلبية'}</h3>
      <label for="fn">الاسم الكامل</label><input id="fn" value="${esc(l.name)}" ${locked?'disabled':''}>
      <label for="fw">الولاية</label>
      <select id="fw" ${locked?'disabled':''}><option value="">اختار الولاية</option>${WILAYAS.map((n,i)=>{const k=i+1,f=fees[k];return `<option value="${k}" ${f?'':'disabled'} ${w===k?'selected':''}>${String(k).padStart(2,'0')} - ${n}${f?'':' (غير متوفر)'}</option>`}).join('')}</select>
      <label>التوصيل</label>
      <div class="seg">
        <label><input type="radio" name="dl" value="المكتب" ${!home?'checked':''} ${locked?'disabled':''}><span>Stop desk · المكتب<b class="num" id="pd"></b></span></label>
        <label><input type="radio" name="dl" value="المنزل" ${home?'checked':''} ${locked?'disabled':''}><span>باب المنزل<b class="num" id="ph"></b></span></label>
      </div>
      <label for="fc">البلدية</label>
      <select id="fc" ${locked?'disabled':''}><option value="">${l.commune?esc(l.commune):'اختار الولاية قبل'}</option></select>
      <div id="fcErr" class="hide" style="color:var(--red);font-size:14px;margin-top:6px">ما قدرتش نجيب البلديات من 48hr. <button class="btn" data-act="reloadc" style="min-height:36px;margin-inline-start:6px">عاود</button></div>
      <label for="fa">العنوان</label><input id="fa" value="${esc(l.address)}" ${locked?'disabled':''}>
      <label for="fnote">ملاحظة</label><textarea id="fnote">${esc(l.note)}</textarea>
      <div class="total"><span>المجموع (7900 + التوصيل)</span><b id="tot">—</b></div>
      <div class="row">
        ${locked ? '' : `<button class="btn green big" data-act="confirm">${ic('check')} أكّد الطلبية</button>`}
        <button class="btn" data-act="note">${ic('note')} سجّل الملاحظة</button>
        ${l.status==='مؤكد' ? `<button class="btn main big" data-act="ship">${ic('truck')} ابعث لـ 48hr</button>` : ''}
      </div>
    </div>
    ${l.log?`<div class="box"><h3>${ic('note')} السجل</h3><div class="log">${esc(l.log)}</div></div>`:''}`;
  $('sheet').classList.remove('hide');
  const fw = $('fw');
  const upd = () => {
    const k = Number(fw.value), f = fees[k];
    const ri = [...document.querySelectorAll('input[name=dl]')];
    $('pd').textContent = f && f[0] != null ? f[0] : '—'; $('ph').textContent = f && f[1] != null ? f[1] : '—';
    if (!locked) ri.forEach(r => { r.disabled = !f || f[r.value==='المنزل'?1:0] == null; if (r.checked && r.disabled) { const o = ri.find(x => !x.disabled); if (o) o.checked = true; } });
    const h = (ri.find(r => r.checked) || {}).value === 'المنزل';
    const fee = feeOf(k, h);
    $('tot').textContent = fee != null ? (price + fee) + ' DA' : '—';
  };
  fw.onchange = () => { upd(); communesList = []; loadCommunes(fw.value, ''); };
  document.querySelectorAll('input[name=dl]').forEach(r => r.onchange = () => { upd(); if (communesList.length) fillCommunes(); });
  upd();
  if (w && !locked) loadCommunes(w, l.commune);
}

let communesList = [];
// Stop desk: only the communes where 48hr has an office.
function fillCommunes(current) {
  const sel = $('fc'); if (!sel) return;
  const desk = (document.querySelector('input[name=dl]:checked') || {}).value === 'المكتب';
  const keep = current ?? sel.value;
  const list = desk ? communesList.filter(c => c.desk) : communesList;
  sel.innerHTML = `<option value="">${desk ? 'اختار البلدية اللي فيها مكتب 48hr' : 'اختار البلدية'}</option>` + list.map(c => `<option ${c.name===keep?'selected':''}>${esc(c.name)}</option>`).join('');
}
async function loadCommunes(w, current) {
  const sel = $('fc'), err = $('fcErr');
  if (!w) return;
  err.classList.add('hide');
  sel.innerHTML = '<option value="">... نجيب البلديات</option>';
  try {
    communesList = (await api('communes', {wilaya: w})).communes;
    if (!communesList.length) throw new Error();
    fillCommunes(current);
  } catch (e) { sel.innerHTML = '<option value="">—</option>'; err.classList.remove('hide'); }
}

function closeSheet() { $('sheet').classList.add('hide'); open = null; render(); }
$('sheet').addEventListener('click', async e => {
  if (e.target.id === 'sheet') return closeSheet();
  const b = e.target.closest('[data-act]'); if (!b || !open) return;
  const act = b.dataset.act, l = open;
  if (act === 'close') return closeSheet();
  if (act === 'dial') return;
  if (act === 'reloadc') { loadCommunes($('fw').value, ''); return; }
  if (act === 'showcb') { $('cbw').classList.toggle('hide'); return; }
  let data;
  const note = $('fnote').value.trim();
  if (act === 'noanswer') data = {status:'ما ردّش', call:true, callback: new Date(Date.now()+3*36e5).toISOString()};
  if (act === 'interested') data = {status:'مهتم', call:true, callback: new Date(Date.now()+24*36e5).toISOString()};
  if (act === 'callback') { const v = $('cb').value; if (!v) return toast('اختار النهار والساعة.', true); data = {status:'عاود عيطلو', call:true, callback: new Date(v).toISOString()}; }
  if (act === 'cancel') data = {status:'ملغي', call:true, note: b.dataset.r + (note ? ' — ' + note : '')};
  if (act === 'note') { if (!note) return toast('اكتب ملاحظة.', true); data = {note}; }
  if (act === 'confirm') {
    const w = $('fw').value, dl = (document.querySelector('input[name=dl]:checked') || {}).value;
    const commune = $('fc').value;
    const name = $('fn').value.trim(), address = $('fa').value.trim();
    if (!name || !w || !dl || !commune) return toast('كمّل الاسم، الولاية، التوصيل، واختار البلدية من القائمة.', true);
    if (dl === 'المنزل' && !address) return toast('اكتب العنوان للتوصيل للمنزل.', true);
    data = {status:'مؤكد', call:true, name, wilaya: w + ' ' + WILAYAS[w-1], delivery: dl, commune, address, note};
  }
  b.disabled = true; const old = b.innerHTML; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = act === 'ship' ? await api('ship', {id: l.id}) : await api('update', {id: l.id, data});
    leads = leads.map(x => x.id === l.id ? r.lead : x);
    toast(act === 'ship' ? 'تبعثت لـ 48hr ✅ ' + r.lead.tracking : 'تسجلت ✅');
    if (act === 'confirm') openLead(l.id); else closeSheet();
  } catch (err) { toast(err.message, true); b.disabled = false; b.innerHTML = old; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closeSheet(); });

/* ---------- admin ---------- */
async function renderAdmin() {
  const by = {};
  leads.forEach(l => { const a = l.agent || '— بلا عامل'; (by[a] = by[a] || {n:0,calls:0,conf:0,ship:0,cancel:0}); const s = by[a];
    s.n++; s.calls += l.attempts; if (['مؤكد','مبعوث'].includes(l.status)) s.conf++; if (l.tracking) s.ship++; if (l.status==='ملغي') s.cancel++; });
  const total = leads.length, conf = leads.filter(l => ['مؤكد','مبعوث'].includes(l.status)).length;
  const reached = leads.filter(l => l.attempts > 0).length;
  const today = new Date().toDateString(), dl = leads.filter(l => new Date(l.at).toDateString() === today).length;
  const rate = reached ? Math.round(conf*100/reached) : 0;
  $('adminView').innerHTML = `
    <div class="kpis">
      <div class="kpi hot"><b class="num">${total}</b><span>حمّلو التطبيق</span></div>
      <div class="kpi"><b class="num">${dl}</b><span>حمّلو اليوم</span></div>
      <div class="kpi"><b class="num">${reached}</b><span>تعيطلهم</span></div>
      <div class="kpi"><b class="num">${conf}</b><span>أكّدو</span></div>
      <div class="kpi"><b class="num">${rate}%</b><span>نسبة التأكيد</span><div class="bar"><i style="width:${rate}%"></i></div></div>
      <div class="kpi"><b class="num">${(conf*price).toLocaleString('fr-DZ')}</b><span>دج (بلا التوصيل)</span></div>
    </div>
    <div class="row" style="margin:0 0 14px"><button class="btn" id="trackAll">${ic('truck')} حدّث حالة التوصيل من 48hr</button></div>
    <div class="box" style="margin-top:0"><h3>${ic('chart')} العمال والنتائج</h3>
      <div class="agents" style="margin-top:10px">${Object.entries(by).map(([a,s]) => { const r = s.n ? Math.round(s.conf*100/s.n) : 0; return `
        <div class="agent"><div class="av" style="--c:#3a332d">${esc(ini(a))}</div>
          <div><div style="display:flex;justify-content:space-between"><b>${esc(a)}</b><b class="num">${r}%</b></div>
            <div class="stats"><span>زبائن <b>${s.n}</b></span><span>اتصالات <b>${s.calls}</b></span><span>أكّدو <b>${s.conf}</b></span><span>بعثو <b>${s.ship}</b></span><span>ملغي <b>${s.cancel}</b></span></div>
            <div class="bar"><i style="width:${r}%"></i></div></div></div>`; }).join('')}</div>
    </div>
    <div class="box"><h3>${ic('user')} الحسابات</h3><div id="users">...</div>
      <div class="grid2" style="margin-top:6px">
        <div><label for="un">الاسم</label><input id="un"></div>
        <div><label for="up">PIN جديد</label><input id="up" inputmode="numeric"></div>
      </div>
      <div class="row"><select id="ur" style="flex:1 1 120px"><option value="agent">عامل</option><option value="admin">مدير</option></select>
      <button class="btn main" id="uadd" style="flex:1 1 120px">زيد / بدّل</button></div>
    </div>`;
  $('trackAll').onclick = async e => { e.target.disabled = true; try { leads = (await api('track')).leads; toast('تحدّثت ✅'); renderAdmin(); } catch (err) { toast(err.message, true); e.target.disabled = false; } };
  $('uadd').onclick = async () => { try { showUsers((await api('users', {data:{name:$('un').value, pin:$('up').value, role:$('ur').value}})).users); $('un').value=$('up').value=''; toast('تسجّل ✅'); } catch (err) { toast(err.message, true); } };
  try { showUsers((await api('users')).users); } catch (err) { $('users').textContent = err.message; }
}
function showUsers(us) {
  $('users').innerHTML = us.map(u => `<div class="user">
    <span>${esc(u.name)} <span class="chip">${u.role==='admin'?'مدير':'عامل'}</span> ${u.active?'':chip('موقّف').replace('var(--muted)','var(--red)')}</span>
    ${u.name===me.name?'':`<button class="btn" style="min-height:36px" data-u="${esc(u.name)}" data-r="${u.role}" data-a="${u.active?0:1}">${u.active?'وقّف':'رجّع'}</button>`}</div>`).join('');
  $('users').querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    try { showUsers((await api('users', {data:{name:b.dataset.u, role:b.dataset.r, active:b.dataset.a==='1'}})).users); } catch (err) { toast(err.message, true); } });
}

/* ---------- boot ---------- */
cred = store.get();
if (cred) start().catch(() => { store.set(null); cred = null; });
}
</script>
</body>
</html>
